# Neutral, restrained light theme. Muted blue accent; no purple.
[theme]
base = "light"
primaryColor = "#1c5cab"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f1f1ee"
textColor = "#0b0b0b"
font = "sans-serif"
baseRadius = "small"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
